<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spotify Web Player</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #121212;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #181818;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
      width: 320px;
    }
    button {
      background: #1DB954;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 50px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      margin-top: 15px;
      transition: transform 0.2s, background 0.2s;
    }
    button:hover {
      background: #1ed760;
      transform: scale(1.03);
    }
    #album-art {
      width: 200px;
      height: 200px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <div id="login-section">
      <h2>Spotify Web Player</h2>
      <p style="color: #b3b3b3; font-size: 14px;">Connect your Spotify Premium account to stream.</p>
      <button id="login-btn">Log In with Spotify</button>
    </div>

    <div id="player-section" class="hidden">
      <img id="album-art" src="" alt="Album Art" />
      <h3 id="track-title" style="margin: 5px 0;">Connecting...</h3>
      <p id="artist-name" style="color: #b3b3b3; margin-top: 0;"></p>
      <button id="play-btn">Pause</button>
    </div>
  </div>
  
  <p><a href="https://getsongbpm.com/">Powered by GetSongBPM</a></p>

  <!-- Spotify Web Playback SDK -->
  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script>
    // ----------------------------------------------------
    // CONFIGURATION (Safe to publish on GitHub Pages)
    // ----------------------------------------------------
    const CLIENT_ID = 'dfa533786a314dafb7162df161a885fd'; // Replace with your Client ID
    const REDIRECT_URI = window.location.origin + window.location.pathname;
    const SCOPES = 'streaming user-read-email user-read-private user-modify-playback-state';

    let player;
    let deviceId;

    // 1. PKCE Helper Functions (Cryptographic Security)
    function generateRandomString(length) {
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      const values = crypto.getRandomValues(new Uint8Array(length));
      return values.reduce((acc, x) => acc + possible[x % possible.length], "");
    }

    async function generateCodeChallenge(codeVerifier) {
      const data = new TextEncoder().encode(codeVerifier);
      const digest = await window.crypto.subtle.digest('SHA-256', data);
      return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    // 2. Auth Flow: Redirect to Spotify
    document.getElementById('login-btn').addEventListener('click', async () => {
      const verifier = generateRandomString(64);
      const challenge = await generateCodeChallenge(verifier);
      localStorage.setItem('code_verifier', verifier);

      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        response_type: 'code',
        redirect_uri: REDIRECT_URI,
        scope: SCOPES,
        code_challenge_method: 'S256',
        code_challenge: challenge,
      });

      window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
    });

    // 3. Auth Flow: Handle Token Exchange after Callback
    async function handleAuthCallback() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');

      if (code) {
        const verifier = localStorage.getItem('code_verifier');
        const params = new URLSearchParams({
          client_id: CLIENT_ID,
          grant_type: 'authorization_code',
          code: code,
          redirect_uri: REDIRECT_URI,
          code_verifier: verifier,
        });

        const response = await fetch('https://accounts.spotify.com/api/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: params
        });

        const data = await response.json();
        if (data.access_token) {
          localStorage.setItem('spotify_access_token', data.access_token);
          window.history.replaceState({}, document.title, window.location.pathname); // Clean URL
          initPlayer(data.access_token);
        }
      } else if (localStorage.getItem('spotify_access_token')) {
        initPlayer(localStorage.getItem('spotify_access_token'));
      }
    }

    // 4. Initialize Web Playback SDK
    function initPlayer(token) {
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('player-section').classList.remove('hidden');

      window.onSpotifyWebPlaybackSDKReady = () => {
        player = new Spotify.Player({
          name: 'GitHub Web Player',
          getOAuthToken: cb => { cb(token); },
          volume: 0.8
        });

        player.addListener('ready', ({ device_id }) => {
          console.log('Ready with Device ID', device_id);
          deviceId = device_id;
          document.getElementById('track-title').innerText = 'Ready to Stream';
          document.getElementById('artist-name').innerText = 'Select this player in Spotify App or click Play';
        });

        player.addListener('player_state_changed', state => {
          if (!state) return;
          const track = state.track_window.current_track;
          document.getElementById('track-title').innerText = track.name;
          document.getElementById('artist-name').innerText = track.artists.map(a => a.name).join(', ');
          
          const albumImg = track.album.images[0]?.url;
          if (albumImg) {
            const imgEl = document.getElementById('album-art');
            imgEl.src = albumImg;
            imgEl.style.display = 'block';
          }

          document.getElementById('play-btn').innerText = state.paused ? 'Play' : 'Pause';
        });

        player.connect();
      };
    }

    document.getElementById('play-btn').addEventListener('click', () => {
      if (player) player.togglePlay();
    });

    handleAuthCallback();
  </script>
</body>
</html>
