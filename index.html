<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Why This Artist is Great — Interactive Listening Gallery</title>

  <style>
    :root {
      --bg: #121212;
      --surface: #181818;
      --surface-hover: #242424;
      --accent: #1DB954;
      --accent-hover: #1ed760;
      --text-main: #FFFFFF;
      --text-muted: #b3b3b3;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 40px 20px 120px; /* Extra bottom padding for sticky player */
      box-sizing: border-box;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    header p {
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto 20px;
      line-height: 1.5;
    }

    button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 12px 26px;
      border-radius: 50px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.1s, background 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
      transform: scale(1.03);
    }

    button:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
      transform: none;
    }

    .hidden { display: none !important; }

    /* Gallery Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 20px;
    }

    .gallery-card {
      background: var(--surface);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #282828;
      transition: background 0.2s, border-color 0.2s;
    }

    .gallery-card:hover {
      background: var(--surface-hover);
    }

    .gallery-card.active-card {
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(29, 185, 84, 0.15);
    }

    .card-number {
      font-size: 12px;
      font-weight: bold;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .card-reason {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 0 0 10px;
    }

    .card-notes {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      margin: 0 0 20px;
      flex-grow: 1;
    }

    .track-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #121212;
      padding: 10px;
      border-radius: 8px;
    }

    .track-box img {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      object-fit: cover;
      background: #282828;
    }

    .track-info {
      flex-grow: 1;
      overflow: hidden;
    }

    .track-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    .play-sample-btn {
      padding: 8px 16px;
      font-size: 13px;
      flex-shrink: 0;
    }

    /* Sticky Bottom Player Bar */
    #sticky-player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #181818;
      border-top: 1px solid #282828;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 100;
    }

    .now-playing {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .now-playing img {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      display: none;
    }

    #status-banner {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1 id="artist-hero-title">Why You Need to Listen to [Artist Name]</h1>
      <p>A curated 12-track tour through their best moments. Log in with Spotify Premium to play the audio examples right inside the page.</p>
      
      <div id="login-section">
        <button id="login-btn">Log In with Spotify to Listen</button>
      </div>
      <div id="status-banner"></div>
    </header>

    <!-- 12-Card Gallery -->
    <div id="gallery" class="gallery-grid"></div>
  </div>

  <!-- Sticky Bottom Player -->
  <div id="sticky-player" class="hidden">
    <div class="now-playing">
      <img id="album-art" src="" alt="Album Art" />
      <div style="overflow:hidden;">
        <div id="track-title" style="font-weight:bold; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Initializing player...</div>
        <div id="artist-name" style="color:#b3b3b3; font-size:12px;">Please wait</div>
      </div>
    </div>
    <button id="global-play-btn">Pause</button>
  </div>

  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script>
    // ====================================================
    // 1. CUSTOMIZE YOUR 12-SONG GALLERY HERE
    // ====================================================
    // Tip: To get a Track ID, click Share -> Copy Song Link in Spotify.
    // In "https://open.spotify.com/track/4cOdK2wGLETKBW3PvgPWqT", the ID is "4cOdK2wGLETKBW3PvgPWqT".
    // Optional: Add `startMs: 65000` to jump straight to a specific solo/moment (in milliseconds)!
    const GALLERY_ITEMS = [
      {
        reason: "1. Effortless Guitar Virtuosity",
        notes: "Listen to how clean the phrasing is here—every note breathes without feeling like mindless shredding.",
        trackId: "4cOdK2wGLETKBW3PvgPWqT",
        startMs: 0 
      },
      {
        reason: "2. Unmatched Live Energy",
        notes: "Most studio bands sound flat on stage, but this track proves they hit twice as hard live.",
        trackId: "4cOdK2wGLETKBW3PvgPWqT",
        startMs: 30000
      },
      {
        reason: "3. Masterclass in Songwriting",
        notes: "Pay attention to the bridge around the 2-minute mark—the chord progression completely shifts the mood.",
        trackId: "4cOdK2wGLETKBW3PvgPWqT"
      },
      // Add items 4 through 12 below following the exact same format:
      { reason: "4. Reason Four", notes: "Your explanation here...", trackId: "4cOdK2wGLETKBW3PvgPWqT" },
      { reason: "5. Reason Five", notes: "Your explanation here...", trackId: "4cOdK2wGLETKBW3PvgPWqT" },
      { reason: "6. Reason Six", notes: "Your explanation here...", trackId: "4cOdK2wGLETKBW3PvgPWqT" },
      { reason: "7. Reason Seven", notes: "Your explanation here...", trackId: "4cOdK2wGLETKBW3PvgPWqT" },
      { reason: "8. Reason Eight", notes: "Your explanation here...", trackId: "4cOdK2wGLETKBW3PvgPWqT" },
      { reason: "9. Reason Nine", notes: "Your explanation here...", trackId: "4cOdK2wGLETKBW3PvgPWqT" },
      { reason: "10. Reason Ten", notes: "Your explanation here...", trackId: "4cOdK2wGLETKBW3PvgPWqT" },
      { reason: "11. Reason Eleven", notes: "Your explanation here...", trackId: "4cOdK2wGLETKBW3PvgPWqT" },
      { reason: "12. Reason Twelve", notes: "Your explanation here...", trackId: "4cOdK2wGLETKBW3PvgPWqT" }
    ];

    // ====================================================
    // 2. CONFIGURATION & STATE
    // ====================================================
    const CLIENT_ID = 'dfa533786a314dafb7162df161a885fd';
    const REDIRECT_URI = window.location.origin + window.location.pathname;
    const SCOPES = 'streaming user-read-email user-read-private user-modify-playback-state';

    let player = null;
    let deviceId = null;
    let activeCardIndex = null;

    function setStatus(msg) {
      document.getElementById('status-banner').textContent = msg;
    }

    // ====================================================
    // 3. RENDER GALLERY CARDS
    // ====================================================
    function renderGallery() {
      const container = document.getElementById('gallery');
      container.innerHTML = '';

      GALLERY_ITEMS.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'gallery-card';
        card.id = `card-${index}`;

        const jumpLabel = item.startMs ? `Starts at ${Math.floor(item.startMs / 1000)}s` : 'Full track';

        card.innerHTML = `
          <div>
            <div class="card-number">Exhibit #${index + 1}</div>
            <h3 class="card-reason">${item.reason}</h3>
            <p class="card-notes">${item.notes}</p>
          </div>
          <div class="track-box">
            <img id="art-${index}" src="" alt="Cover" />
            <div class="track-info">
              <div class="track-name" id="title-${index}">Loading track...</div>
              <div class="track-meta" id="meta-${index}">${jumpLabel}</div>
            </div>
            <button class="play-sample-btn" id="btn-${index}" onclick="playSample(${index})" disabled>
              Play
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Fetch track titles & album covers in bulk once logged in
    async function hydrateTrackDetails(token) {
      const uniqueIds = [...new Set(GALLERY_ITEMS.map(i => i.trackId))];
      try {
        const res = await fetch(`https://api.spotify.com/v1/tracks?ids=${uniqueIds.join(',')}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        const trackMap = {};
        (data.tracks || []).forEach(t => { if (t) trackMap[t.id] = t; });

        GALLERY_ITEMS.forEach((item, index) => {
          const track = trackMap[item.trackId];
          if (track) {
            document.getElementById(`title-${index}`).textContent = track.name;
            const img = track.album?.images?.[2]?.url || track.album?.images?.[0]?.url;
            if (img) document.getElementById(`art-${index}`).src = img;
          }
        });
      } catch (err) {
        console.error('Failed to load track metadata:', err);
      }
    }

    // ====================================================
    // 4. PLAY SPECIFIC SONG ON CLICK
    // ====================================================
    async function playSample(index) {
      if (!deviceId) {
        setStatus('Player is still connecting, try again in a second...');
        return;
      }

      const item = GALLERY_ITEMS[index];
      const token = localStorage.getItem('spotify_access_token');

      // Highlight active card
      document.querySelectorAll('.gallery-card').forEach(c => c.classList.remove('active-card'));
      document.getElementById(`card-${index}`).classList.add('active-card');
      activeCardIndex = index;

      try {
        const response = await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            uris: [`spotify:track:${item.trackId}`],
            position_ms: item.startMs || 0
          })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error?.message || `HTTP ${response.status}`);
        }
      } catch (err) {
        setStatus(`Playback error: ${err.message}`);
      }
    }

    // ====================================================
    // 5. PKCE AUTHENTICATION
    // ====================================================
    function generateRandomString(length) {
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      const values = crypto.getRandomValues(new Uint8Array(length));
      return values.reduce((acc, x) => acc + possible[x % possible.length], '');
    }

    async function generateCodeChallenge(verifier) {
      const data = new TextEncoder().encode(verifier);
      const digest = await crypto.subtle.digest('SHA-256', data);
      return btoa(String.fromCharCode(...new Uint8Array(digest)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    document.getElementById('login-btn').addEventListener('click', async () => {
      const verifier = generateRandomString(64);
      const challenge = await generateCodeChallenge(verifier);
      localStorage.setItem('code_verifier', verifier);

      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        response_type: 'code',
        redirect_uri: REDIRECT_URI,
        scope: SCOPES,
        code_challenge_method: 'S256',
        code_challenge: challenge
      });

      window.location.href = `https://accounts.spotify.com/authorize?${params}`;
    });

    async function handleAuthCallback() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');

      if (code) {
        const verifier = localStorage.getItem('code_verifier');
        const params = new URLSearchParams({
          client_id: CLIENT_ID,
          grant_type: 'authorization_code',
          code,
          redirect_uri: REDIRECT_URI,
          code_verifier: verifier
        });

        const response = await fetch('https://accounts.spotify.com/api/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: params
        });
        const data = await response.json();

        if (data.access_token) {
          localStorage.setItem('spotify_access_token', data.access_token);
          localStorage.setItem('spotify_expires_at', String(Date.now() + data.expires_in * 1000));
          localStorage.removeItem('code_verifier');
          window.history.replaceState({}, document.title, window.location.pathname);
          onAuthenticated(data.access_token);
        }
      } else {
        const token = localStorage.getItem('spotify_access_token');
        const expiry = Number(localStorage.getItem('spotify_expires_at') || 0);
        if (token && Date.now() < expiry - 60000) {
          onAuthenticated(token);
        }
      }
    }

    function onAuthenticated(token) {
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('sticky-player').classList.remove('hidden');
      hydrateTrackDetails(token);
      if (window.Spotify) initPlayer(token);
    }

    // ====================================================
    // 6. WEB PLAYBACK SDK INITIALIZATION
    // ====================================================
    window.onSpotifyWebPlaybackSDKReady = () => {
      const token = localStorage.getItem('spotify_access_token');
      if (token) initPlayer(token);
    };

    function initPlayer(token) {
      if (player) return;

      player = new Spotify.Player({
        name: 'Artist Showcase Gallery',
        getOAuthToken: cb => cb(localStorage.getItem('spotify_access_token') || token),
        volume: 0.8
      });

      player.addListener('ready', ({ device_id }) => {
        deviceId = device_id;
        setStatus('Connected! Click "Play" on any card below to listen.');
        document.getElementById('track-title').textContent = 'Ready to play';
        document.getElementById('artist-name').textContent = 'Pick any card above';
        // Enable all card play buttons
        document.querySelectorAll('.play-sample-btn').forEach(btn => btn.disabled = false);
      });

      player.addListener('player_state_changed', state => {
        if (!state) return;
        const track = state.track_window.current_track;
        document.getElementById('track-title').textContent = track.name;
        document.getElementById('artist-name').textContent = track.artists.map(a => a.name).join(', ');
        document.getElementById('global-play-btn').textContent = state.paused ? 'Play' : 'Pause';

        const img = track.album?.images?.[0]?.url;
        const artEl = document.getElementById('album-art');
        if (img) {
          artEl.src = img;
          artEl.style.display = 'block';
        }
      });

      player.addListener('account_error', ({ message }) => setStatus(`Spotify Premium required: ${message}`));
      player.addListener('authentication_error', ({ message }) => setStatus(`Auth error: ${message}`));

      player.connect();
    }

    document.getElementById('global-play-btn').addEventListener('click', () => {
      if (player) player.togglePlay();
    });

    // Boot
    renderGallery();
    handleAuthCallback().catch(err => setStatus(`Error: ${err.message}`));
  </script>
</body>
</html>
